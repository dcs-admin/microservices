apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
    spec:
      containers:
        - name: customer-service
          image: customer-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 1000
          env:
            - name: DB_HOST
              value: mysql 

---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
spec:
  selector:
    app: customer-service
  ports:
    - protocol: TCP
      port: 1000       # Port exposed inside the cluster
      targetPort: 1000 # Container port
      nodePort:   30002
  type: NodePort       # Optional: expose to your host system (Docker Desktop)
