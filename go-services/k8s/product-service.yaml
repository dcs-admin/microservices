apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: product-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 2000
          env:
            - name: DB_HOST
              value: mysql 
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
spec:
  selector:
    app: product-service
  ports:
    - protocol: TCP
      port: 2000       # Port exposed inside the cluster
      targetPort: 2000 # Container port
      nodePort:   30003
  type: NodePort       # Optional: expose to your host system (Docker Desktop)
