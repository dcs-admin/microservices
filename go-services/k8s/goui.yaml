apiVersion: apps/v1
kind: Deployment
metadata:
  name: goui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: goui
  template:
    metadata:
      labels:
        app: goui
    spec:
      containers:
        - name: goui
          image: goui:local
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: goui
spec:
  type: NodePort
  selector:
    app: goui
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32000
